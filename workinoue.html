<!DOCTYPE html>
<html lang="ja">
<head>

    <!-- 追加：背景の流体マーブル -->

        <div class="ink-blob ink-2"></div>
        <div class="ink-blob ink-3"></div>
        <div class="ink-blob ink-4"></div>
    </div>
    <div id="bg-outline">
        <div class="outline-blob outline-1"></div>
        <div class="outline-blob outline-2"></div>

    <!-- ヘッダー -->
    <header class="site-header">
        <div class="header-inner">
            <!-- 戻るボタン（前回のTipsを反映し、#works の位置に戻るように設定） -->
            <a href="index.html#works" class="back-link">

                <span class="detail-date">2026.09.26</span>

            </div>
        </div>

        <!-- 詳細テキスト -->
        <div class="detail-content">
            <p>2026.05.09-10 and 2026.07.10</p>
            
            <h4>作品に込めた思いや演出の意図</h4>
            <p>突発的に呼ばれた僕ら5人で作ったライブ演出でした。いい経験でした。</p>

            <p>文字演出と反射レーザー演出をメインに作らせていただきました。だいぶ特殊なことをしたなぁという気持ちです。</p>
        </div>

        <!-- 外部サイトへのリンクボタン -->
        <div class="external-links">
            <a href="https://x.com/MAAAAAAAASAHIRO/status/2075806603081642131?s=20" target="_blank" class="ext-btn">告知ポスト</a>
        </div>

        <!-- 参考写真ギャラリー -->
        <h4 style="margin-bottom: 15px; color: var(--text-main);">Gallery</h4>
        <div class="detail-gallery">
            <div class="gallery-item">
                <img src="https://placehold.co/400x300/e2e8f0/94a3b8?text=Photo+1" alt="参考写真1">

            <div class="gallery-item">
