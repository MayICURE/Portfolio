<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRChat アプローチB：尖った花弁の蕾ワールド（スマホ対応版）</title>
  <style>
    body {
      margin: 0; padding: 0; overflow: hidden;
      background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    
    /* スマホで見やすい下部コントロールパネル */
    #ui-panel {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(22, 27, 34, 0.94); border-top: 1px solid #30363d;
      border-top-left-radius: 16px; border-top-right-radius: 16px;
      padding: 16px 20px 28px 20px; box-sizing: border-box;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.6); z-index: 10;
    }
    h2 { margin: 0 0 6px 0; font-size: 14px; color: #58a6ff; }
    .status-badge {
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
      margin-bottom: 10px; background: #1f2937; border-left: 4px solid #3fb950;
    }
    .control-row { margin-bottom: 10px; font-size: 12px; }
    .control-row label { display: flex; justify-content: space-between; margin-bottom: 4px; }
    input[type="range"] { width: 100%; height: 32px; cursor: pointer; accent-color: #58a6ff; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 6px; }
    .btn-grid button {
      padding: 10px 4px; border: 1px solid #30363d; border-radius: 8px;
      background: #21262d; color: #e6edf3; font-size: 12px; font-weight: bold;
      touch-action: manipulation;
    }
    .btn-grid button:active { background: #1f6feb; border-color: #58a6ff; }
    .action-btn {
      width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #30363d;
      border-radius: 8px; background: #8957e5; color: white; font-size: 12px; font-weight: bold;
    }
    .action-btn:active { background: #a371f7; }
    .hint { font-size: 10px; color: #8b949e; text-align: center; margin-top: 8px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-panel">
  <h2>アプローチB：尖った花弁（スマホ対応シミュレーター）</h2>
  <div id="state-badge" class="status-badge">状態①：完全な平面（隙間も歩行可能）</div>

  <div class="control-row">
    <label><span>蕾の開閉度 (t)</span><span id="val-close">0% (平面)</span></label>
    <input type="range" id="slider-close" min="0" max="1" step="0.005" value="0">
  </div>

  <div class="control-row">
    <label><span>プレイヤー移動操作（ボタンをタップ長押し）</span></label>
    <div class="btn-grid">
      <div></div>
      <button id="btn-up">▲ 進む</button>
      <div></div>
      <button id="btn-left">◀ 左</button>
      <button id="btn-down">▼ 戻る</button>
      <button id="btn-right">右 ▶</button>
    </div>
  </div>

  <button class="action-btn" id="btn-test-hop">★ 隙間に配置して「ぴょん！」と飛び乗りテスト</button>
  <div class="hint">画面を指でドラッグするとカメラアングルを回転できます。</div>
</div>

<script>
// --- シーン構築 ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 24, 34);
camera.lookAt(0, 4, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(20, 40, 25);
scene.add(dirLight);

// --- パラメータ ---
const PETAL_COUNT = 8;
const SPHERE_RADIUS = 9.0;
const MAX_ARC_S = Math.PI * SPHERE_RADIUS;
const EDGE_MARGIN = 0.25;

let closeAmount = 0.0;
let playerXZ = new THREE.Vector2(7.0, 0.0);
let currentPetalIndex = 0;

let isHopping = false;
let hopTimer = 0.0;
const HOP_DURATION = 0.4;
const HOP_HEIGHT = 2.0;
let hopStartXZ = new THREE.Vector2();
let hopEndXZ = new THREE.Vector2();
let hopHeightOffset = 0.0;

// --- 幾何学計算関数 ---
function getPetalHalfWidth(s) {
  const theta = Math.max(0.001, Math.min(Math.PI - 0.001, s / SPHERE_RADIUS));
  return (Math.PI / PETAL_COUNT) * SPHERE_RADIUS * Math.sin(theta);
}

function getPetalCenterAngle(petalIdx) {
  return petalIdx * ((Math.PI * 2) / PETAL_COUNT);
}

function getNearestPetalIndex(xz) {
  if (xz.lengthSq() < 0.0001) return 0;
  let angle = Math.atan2(xz.y, xz.x);
  if (angle < 0) angle += Math.PI * 2;
  const sector = (Math.PI * 2) / PETAL_COUNT;
  return Math.round(angle / sector) % PETAL_COUNT;
}

function isInsidePetalBounds(xz, petalIdx, margin) {
  if (xz.length() < 1.0) return true;
  const angle = getPetalCenterAngle(petalIdx);
  const axis = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
  const perp = new THREE.Vector2(-axis.y, axis.x);
  const s = xz.dot(axis);
  if (s <= 0 || s >= MAX_ARC_S) return false;
  const u = Math.abs(xz.dot(perp));
  return u <= Math.max(getPetalHalfWidth(s) - margin, 0.05);
}

function evaluatePointedPetalPoint(s, eta, petalIdx, t) {
  const centerPhi = getPetalCenterAngle(petalIdx);
  const axisX = Math.cos(centerPhi), axisZ = Math.sin(centerPhi);
  const perpX = -axisZ, perpZ = axisX;
  const halfW = getPetalHalfWidth(s);
  const u = eta * halfW;

  if (t <= 0.0001) {
    return { pos: new THREE.Vector3(axisX * s + perpX * u, 0, axisZ * s + perpZ * u), normal: new THREE.Vector3(0, 1, 0) };
  }

  const curvature = t / SPHERE_RADIUS;
  const Rt = 1.0 / curvature;
  const theta_t = s * curvature;
  const r_t = Rt * Math.sin(theta_t);
  const y_t = Rt * (1.0 - Math.cos(theta_t));

  const deltaPhi1 = eta * (Math.PI / PETAL_COUNT);
  const flatX = axisX * r_t + perpX * u;
  const flatZ = axisZ * r_t + perpZ * u;
  const rotDirX = axisX * Math.cos(deltaPhi1) + perpX * Math.sin(deltaPhi1);
  const rotDirZ = axisZ * Math.cos(deltaPhi1) + perpZ * Math.sin(deltaPhi1);
  const sphereX = r_t * rotDirX, sphereZ = r_t * rotDirZ;

  const finalX = (1.0 - t) * flatX + t * sphereX;
  const finalZ = (1.0 - t) * flatZ + t * sphereZ;
  const pos = new THREE.Vector3(finalX, y_t, finalZ);
  const sphereCenter = new THREE.Vector3(0, Rt, 0);
  const normal = sphereCenter.clone().sub(pos).normalize();

  return { pos, normal };
}

function evaluatePlayerSurface(xz, petalIdx, t, hopY) {
  const centerPhi = getPetalCenterAngle(petalIdx);
  const axis = new THREE.Vector2(Math.cos(centerPhi), Math.sin(centerPhi));
  const perp = new THREE.Vector2(-axis.y, axis.x);
  const s = Math.max(0.01, Math.min(MAX_ARC_S * 0.97, xz.dot(axis)));
  const u = xz.dot(perp);
  const halfW = Math.max(getPetalHalfWidth(s), 0.01);
  const eta = u / halfW;

  const surf = evaluatePointedPetalPoint(s, eta, petalIdx, t);
  const finalPos = surf.pos.clone().addScaledVector(surf.normal, hopY);
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), surf.normal);
  return { pos: finalPos, quat: q };
}

// --- 3Dオブジェクト生成 ---
const visualWorldRoot = new THREE.Group();
scene.add(visualWorldRoot);

const SEG_S = 28, SEG_U = 10;
const petalMeshes = [];

for (let k = 0; k < PETAL_COUNT; k++) {
  const geom = new THREE.BufferGeometry();
  const vertices = [], indices = [];
  for (let i = 0; i <= SEG_S; i++) {
    for (let j = 0; j <= SEG_U; j++) vertices.push(0, 0, 0);
  }
  for (let i = 0; i < SEG_S; i++) {
    for (let j = 0; j < SEG_U; j++) {
      const a = i * (SEG_U + 1) + j, b = a + 1, c = (i + 1) * (SEG_U + 1) + j, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

  const hue = (k / PETAL_COUNT) * 0.12 + 0.55;
  const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.45), side: THREE.DoubleSide, roughness: 0.35 });
  const mesh = new THREE.Mesh(geom, mat);
  visualWorldRoot.add(mesh);
  petalMeshes.push(mesh);
}

const flatGapGrid = new THREE.PolarGridHelper(MAX_ARC_S, 14, 6, 32, 0x1f6feb, 0x16335b);
flatGapGrid.position.y = -0.03;
visualWorldRoot.add(flatGapGrid);

// プレイヤー（青アバター）
const playerGroup = new THREE.Group();
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.2, 12), new THREE.MeshStandardMaterial({ color: 0x2f81f7 }));
body.position.y = 0.6;
playerGroup.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
head.position.y = 1.45;
playerGroup.add(head);
scene.add(playerGroup);

// --- 更新処理 ---
function updatePetals(t) {
  for (let k = 0; k < PETAL_COUNT; k++) {
    const posAttr = petalMeshes[k].geometry.attributes.position;
    let idx = 0;
    for (let i = 0; i <= SEG_S; i++) {
      const s = (i / SEG_S) * MAX_ARC_S;
      for (let j = 0; j <= SEG_U; j++) {
        const eta = (j / SEG_U) * 2.0 - 1.0;
        const { pos } = evaluatePointedPetalPoint(s, eta, k, t);
        posAttr.setXYZ(idx++, pos.x, pos.y, pos.z);
      }
    }
    posAttr.needsUpdate = true;
    petalMeshes[k].geometry.computeVertexNormals();
    petalMeshes[k].material.emissive.setHex(k === currentPetalIndex ? 0x112a46 : 0x000000);
  }
  flatGapGrid.visible = (t <= 0.01);
}

function triggerHop() {
  currentPetalIndex = getNearestPetalIndex(playerXZ);
  const angle = getPetalCenterAngle(currentPetalIndex);
  const axis = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
  const perp = new THREE.Vector2(-axis.y, axis.x);
  const s = Math.max(1.5, Math.min(MAX_ARC_S * 0.9, playerXZ.length()));
  const safeHalfW = Math.max(getPetalHalfWidth(s) - EDGE_MARGIN, 0.1);
  const clampedU = Math.max(-safeHalfW, Math.min(safeHalfW, playerXZ.dot(perp)));

  hopStartXZ.copy(playerXZ);
  hopEndXZ.copy(axis.clone().multiplyScalar(s).add(perp.clone().multiplyScalar(clampedU)));
  hopTimer = 0.0;
  isHopping = true;
}

const inputState = { up: false, down: false, left: false, right: false };
function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); inputState[key] = true; });
  el.addEventListener('touchend',   e => { e.preventDefault(); inputState[key] = false; });
  el.addEventListener('mousedown',  () => inputState[key] = true);
  el.addEventListener('mouseup',    () => inputState[key] = false);
  el.addEventListener('mouseleave', () => inputState[key] = false);
}
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');

document.getElementById('btn-test-hop').addEventListener('click', () => {
  closeAmount = 0.0;
  document.getElementById('slider-close').value = 0;
  const gapAngle = (Math.PI * 2 / PETAL_COUNT) * 0.5;
  playerXZ.set(Math.cos(gapAngle) * 12.0, Math.sin(gapAngle) * 12.0);
  currentPetalIndex = 0;
  setTimeout(() => {
    closeAmount = 0.35;
    document.getElementById('slider-close').value = 0.35;
    document.getElementById('val-close').textContent = "35% (飛び乗り発動!)";
  }, 120);
});

const sliderClose = document.getElementById('slider-close');
const valClose = document.getElementById('val-close');
sliderClose.addEventListener('input', e => {
  closeAmount = parseFloat(e.target.value);
  const pct = Math.round(closeAmount * 100);
  valClose.textContent = pct === 0 ? "0% (平面)" : pct === 100 ? "100% (球体)" : `${pct}% (遷移中)`;
});

// スマホタッチでのカメラ回転用
let isDragging = false, prevMousePos = { x: 0, y: 0 };
window.addEventListener('touchstart', e => {
  if (e.target.closest('#ui-panel')) return;
  isDragging = true; prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - prevMousePos.x;
  visualWorldRoot.rotation.y += dx * 0.008;
  prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
window.addEventListener('touchend', () => isDragging = false);

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  const speed = 7.0;
  const radial = playerXZ.length() > 0.1 ? playerXZ.clone().normalize() : new THREE.Vector2(1, 0);
  const tangent = new THREE.Vector2(-radial.y, radial.x);
  const moveStep = new THREE.Vector2();

  if (inputState.up)    moveStep.addScaledVector(radial, speed * dt);
  if (inputState.down)  moveStep.addScaledVector(radial, -speed * dt);
  if (inputState.right) moveStep.addScaledVector(tangent, speed * dt);
  if (inputState.left)  moveStep.addScaledVector(tangent, -speed * dt);

  const badge = document.getElementById('state-badge');
  const isFlat = (closeAmount <= 0.005);
  const isSphere = (closeAmount >= 0.995);

  if (isHopping) {
    hopTimer += dt / HOP_DURATION;
    if (hopTimer >= 1.0) { hopTimer = 1.0; isHopping = false; hopHeightOffset = 0.0; }
    else { hopHeightOffset = Math.sin(hopTimer * Math.PI) * HOP_HEIGHT; }
    playerXZ.lerpVectors(hopStartXZ, hopEndXZ, Math.smoothStep ? Math.smoothStep(0,1,hopTimer) : hopTimer);
    badge.textContent = "状態②：隙間から最寄りの花弁へ「ぴょん！」と飛び乗り中";
    badge.style.borderLeftColor = "#a371f7";
  } else if (isFlat) {
    playerXZ.add(moveStep);
    if (playerXZ.length() > MAX_ARC_S * 0.92) playerXZ.normalize().multiplyScalar(MAX_ARC_S * 0.92);
    currentPetalIndex = getNearestPetalIndex(playerXZ);
    const inGap = !isInsidePetalBounds(playerXZ, currentPetalIndex, 0.0);
    badge.textContent = inGap ? "状態①：平面（花弁の「隙間」の上を歩行中！）" : "状態①：完全な平面（隙間も自由に行き来可能）";
    badge.style.borderLeftColor = "#3fb950";
  } else if (isSphere) {
    const d = Math.max(playerXZ.length(), 0.3);
    const rDir = playerXZ.clone().divideScalar(d);
    const tDir = new THREE.Vector2(-rDir.y, rDir.x);
    const ringR = SPHERE_RADIUS * Math.sin(Math.max(0.05, Math.min(Math.PI - 0.05, d / SPHERE_RADIUS)));
    const newD = Math.max(0.5, Math.min(MAX_ARC_S * 0.92, d + moveStep.dot(rDir)));
    const newPhi = Math.atan2(playerXZ.y, playerXZ.x) + moveStep.dot(tDir) / ringR;
    playerXZ.set(Math.cos(newPhi) * newD, Math.sin(newPhi) * newD);
    currentPetalIndex = getNearestPetalIndex(playerXZ);
    badge.textContent = `状態④：完全な球体（花弁#${currentPetalIndex + 1} 切れ目を越えて360°周回可能）`;
    badge.style.borderLeftColor = "#58a6ff";
  } else {
    if (!isInsidePetalBounds(playerXZ, currentPetalIndex, -0.05)) {
      triggerHop();
    } else {
      const nextXZ = playerXZ.clone().add(moveStep);
      const angle = getPetalCenterAngle(currentPetalIndex);
      const axis = new THREE.Vector2(Math.cos(angle), Math.sin(angle));
      const perp = new THREE.Vector2(-axis.y, axis.x);
      const s = Math.max(0.6, Math.min(MAX_ARC_S * 0.92, nextXZ.dot(axis)));
      const maxU = Math.max(getPetalHalfWidth(s) - EDGE_MARGIN, 0.05);
      const u = Math.max(-maxU, Math.min(maxU, nextXZ.dot(perp)));
      playerXZ.copy(axis.multiplyScalar(s).add(perp.multiplyScalar(u)));
      badge.textContent = `状態③：遷移中（花弁#${currentPetalIndex + 1} の縁で落下防止ロック作動中）`;
      badge.style.borderLeftColor = "#d29922";
    }
  }

  updatePetals(closeAmount);
  const surf = evaluatePlayerSurface(playerXZ, currentPetalIndex, closeAmount, hopHeightOffset);

  // VRChat方式の自分基準視点（自分が常に原点に直立、世界が逆回転）
  playerGroup.position.set(0, 0, 0);
  playerGroup.quaternion.identity();

  const invQuat = surf.quat.clone().invert();
  // ユーザーのドラッグによる回転（visualWorldRoot.rotation.y）を保持しつつ逆回転を適用
  const currentWorldY = visualWorldRoot.rotation.y;
  visualWorldRoot.quaternion.copy(invQuat);
  visualWorldRoot.rotation.y += currentWorldY;
  
  const rotatedOffset = surf.pos.clone().applyQuaternion(invQuat);
  visualWorldRoot.position.copy(rotatedOffset.negate());

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
