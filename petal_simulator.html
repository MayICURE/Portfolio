<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRChat アプローチB：完全版 尖った花弁の蕾ワールドシミュレーター</title>
  <style>
    body {
      margin: 0; padding: 0; overflow: hidden;
      background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      touch-action: none;
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    #ui-panel {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: rgba(22, 27, 34, 0.95); border-top: 1px solid #30363d;
      border-top-left-radius: 16px; border-top-right-radius: 16px;
      padding: 14px 20px 24px 20px; box-sizing: border-box;
      box-shadow: 0 -8px 24px rgba(0,0,0,0.6); z-index: 10;
    }
    h2 { margin: 0 0 6px 0; font-size: 14px; color: #58a6ff; }
    .status-badge {
      padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: bold;
      margin-bottom: 8px; background: #1f2937; border-left: 4px solid #3fb950;
    }
    .control-row { margin-bottom: 8px; font-size: 12px; }
    .control-row label { display: flex; justify-content: space-between; margin-bottom: 3px; }
    input[type="range"] { width: 100%; height: 28px; cursor: pointer; accent-color: #58a6ff; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 4px; }
    .btn-grid button {
      padding: 8px 2px; border: 1px solid #30363d; border-radius: 6px;
      background: #21262d; color: #e6edf3; font-size: 11px; font-weight: bold;
      touch-action: manipulation;
    }
    .btn-grid button:active { background: #1f6feb; border-color: #58a6ff; }
    .action-row { display: flex; gap: 6px; margin-top: 6px; }
    .action-btn {
      flex: 1; padding: 8px; border: 1px solid #30363d;
      border-radius: 6px; background: #8957e5; color: white; font-size: 11px; font-weight: bold;
    }
    .action-btn:active { background: #a371f7; }
    .action-btn.secondary { background: #21262d; color: #58a6ff; border-color: #388bfd; }
    .hint { font-size: 10px; color: #8b949e; text-align: center; margin-top: 6px; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="ui-panel">
  <h2>アプローチB：完全版（極点通過・隙間歩行・上下頂点一致）</h2>
  <div id="state-badge" class="status-badge">状態①：平面（花弁の上も隙間も自由に歩行可能）</div>

  <div class="control-row">
    <label><span>蕾の開閉度 (t)</span><span id="val-close">0% (平面ステージ)</span></label>
    <input type="range" id="slider-close" min="0" max="1" step="0.005" value="0">
  </div>

  <div class="control-row">
    <label><span>プレイヤー移動操作（ボタンをタップ長押し）</span></label>
    <div class="btn-grid">
      <div></div>
      <button id="btn-up">▲ 先端へ</button>
      <div></div>
      <button id="btn-left">◀ 左</button>
      <button id="btn-down">▼ 根元へ</button>
      <button id="btn-right">右 ▶</button>
    </div>
  </div>

  <div class="action-row">
    <button class="action-btn secondary" id="btn-test-gap">★ 隙間に配置する</button>
    <button class="action-btn" id="btn-test-pole">★ 北極点（先端）を直進突破</button>
  </div>
  <div class="hint">画面を指でドラッグするとカメラ視点を回転できます。</div>
</div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, 22, 34);
camera.lookAt(0, 5, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(20, 40, 25);
scene.add(dirLight);

// --- パラメータ ---
const PETAL_COUNT = 8;
const SPHERE_RADIUS = 9.0;
const MAX_S = Math.PI * SPHERE_RADIUS;

let closeAmount = 0.0;
let petalIndex = 0;
let arcS = 7.0;
let eta = 0.0;
let yaw = 0.0;

// Hopping (隙間からの飛び乗り)
let isHopping = false;
let hopTimer = 0.0;
const HOP_DURATION = 0.38;
const HOP_HEIGHT = 2.0;
let hopStartEta = 0.0;
let hopTargetEta = 0.0;
let hopY = 0.0;

// --- Sinc関数 & 幾何学計算 ---
function sinc(x) {
  if (Math.abs(x) < 0.0001) return 1.0 - (x * x) / 6.0;
  return Math.sin(x) / x;
}

function evaluatePetalSurface(pIdx, s, e, t, hy) {
  const maxS = Math.PI * SPHERE_RADIUS;
  const clampedS = Math.max(0, Math.min(maxS, s));
  const theta1 = clampedS / SPHERE_RADIUS;

  const centerPhi = pIdx * ((Math.PI * 2) / PETAL_COUNT);
  const halfSectorAngle = Math.PI / PETAL_COUNT;

  const sincTheta1 = sinc(theta1);
  const sincThetaT = sinc(t * theta1);
  const angleScale = (Math.abs(sincThetaT) > 0.00001) ? (sincTheta1 / sincThetaT) : 0;
  const phi = centerPhi + e * halfSectorAngle * angleScale;

  let basePos, inwardNormal;
  const theta_t = t * theta1;

  if (t <= 0.0001) {
    basePos = new THREE.Vector3(clampedS * Math.cos(phi), 0, clampedS * Math.sin(phi));
    inwardNormal = new THREE.Vector3(0, 1, 0);
  } else {
    const Rt = SPHERE_RADIUS / t;
    const ringR = Rt * Math.sin(theta_t);
    const vertY = Rt * (1.0 - Math.cos(theta_t));
    basePos = new THREE.Vector3(ringR * Math.cos(phi), vertY, ringR * Math.sin(phi));
    const sphereCenter = new THREE.Vector3(0, Rt, 0);
    inwardNormal = sphereCenter.clone().sub(basePos).normalize();
  }

  const radialTangent = new THREE.Vector3(
    Math.cos(theta_t) * Math.cos(phi),
    Math.sin(theta_t),
    Math.cos(theta_t) * Math.sin(phi)
  ).normalize();

  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), inwardNormal);
  const finalPos = basePos.clone().addScaledVector(inwardNormal, hy);
  return { pos: finalPos, quat: q };
}

// --- 3Dオブジェクト生成 ---
const visualWorldRoot = new THREE.Group();
scene.add(visualWorldRoot);

const SEG_S = 32, SEG_U = 10;
const petalMeshes = [];

for (let k = 0; k < PETAL_COUNT; k++) {
  const geom = new THREE.BufferGeometry();
  const vertices = [], indices = [];
  for (let i = 0; i <= SEG_S; i++) {
    for (let j = 0; j <= SEG_U; j++) vertices.push(0, 0, 0);
  }
  for (let i = 0; i < SEG_S; i++) {
    for (let j = 0; j < SEG_U; j++) {
      const a = i * (SEG_U + 1) + j, b = a + 1, c = (i + 1) * (SEG_U + 1) + j, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  geom.setIndex(indices);
  geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

  const hue = (k / PETAL_COUNT) * 0.12 + 0.55;
  const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(hue, 0.65, 0.45), side: THREE.DoubleSide, roughness: 0.35 });
  const mesh = new THREE.Mesh(geom, mat);
  visualWorldRoot.add(mesh);
  petalMeshes.push(mesh);
}

// 南北の頂点（上下の極）の重なりを確認できる目印の光るポールマーカー
const poleGeo = new THREE.SphereGeometry(0.35, 16, 16);
const poleMat = new THREE.MeshBasicMaterial({ color: 0xff5555 });
const northPoleMarker = new THREE.Mesh(poleGeo, poleMat);
visualWorldRoot.add(northPoleMarker);

const southPoleMarker = new THREE.Mesh(poleGeo, new THREE.MeshBasicMaterial({ color: 0x55ff55 }));
visualWorldRoot.add(southPoleMarker);

// プレイヤーアバター
const playerGroup = new THREE.Group();
const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.2, 12), new THREE.MeshStandardMaterial({ color: 0x2f81f7 }));
body.position.y = 0.6;
playerGroup.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
head.position.y = 1.45;
playerGroup.add(head);
scene.add(playerGroup);

// --- メッシュ更新 ---
function updatePetals(t) {
  for (let k = 0; k < PETAL_COUNT; k++) {
    const posAttr = petalMeshes[k].geometry.attributes.position;
    let idx = 0;
    for (let i = 0; i <= SEG_S; i++) {
      const tau = i / SEG_S;
      const s = tau * MAX_S;
      for (let j = 0; j <= SEG_U; j++) {
        const e = (j / SEG_U) * 2.0 - 1.0;
        const { pos } = evaluatePetalSurface(k, s, e, t, 0);
        posAttr.setXYZ(idx++, pos.x, pos.y, pos.z);
      }
    }
    posAttr.needsUpdate = true;
    petalMeshes[k].geometry.computeVertexNormals();
    petalMeshes[k].material.emissive.setHex(k === petalIndex ? 0x112a46 : 0x000000);
  }

  // 上下の極の位置を更新
  if (t <= 0.0001) {
    southPoleMarker.position.set(0, 0, 0);
    northPoleMarker.position.set(0, MAX_S, 0);
  } else {
    const Rt = SPHERE_RADIUS / t;
    southPoleMarker.position.set(0, 0, 0);
    northPoleMarker.position.set(0, Rt * (1.0 - Math.cos(t * Math.PI)), 0); // t=1のとき厳密に (0, 2R, 0)
  }
}

// --- 移動ロジック ---
function stepMovement(ds, du) {
  const isFlat = (closeAmount <= 0.001);
  const isSphere = (closeAmount >= 0.999);
  const badge = document.getElementById('state-badge');

  if (isHopping) {
    hopTimer += 0.016 / HOP_DURATION;
    if (hopTimer >= 1.0) { hopTimer = 1.0; isHopping = false; hopY = 0; }
    else { hopY = Math.sin(hopTimer * Math.PI) * HOP_HEIGHT; }
    eta = THREE.MathUtils.lerp(hopStartEta, hopTargetEta, hopTimer);
    badge.textContent = "状態②：隙間から最寄りの花弁へ「ぴょん！」と飛び乗り中";
    badge.style.borderLeftColor = "#a371f7";
    return;
  }

  arcS += ds;
  
  // 極点（北極・南極）のシームレス通過（向かい側の花弁 k + N/2 へ通り抜け）
  if (arcS > MAX_S) {
    const overflow = arcS - MAX_S;
    arcS = MAX_S - overflow;
    petalIndex = (petalIndex + PETAL_COUNT / 2) % PETAL_COUNT;
    eta = -eta;
  } else if (arcS < 0) {
    const underflow = -arcS;
    arcS = underflow;
    petalIndex = (petalIndex + PETAL_COUNT / 2) % PETAL_COUNT;
    eta = -eta;
  }

  const theta1 = Math.max(0.05, Math.min(Math.PI - 0.05, arcS / SPHERE_RADIUS));
  const halfW = (Math.PI * SPHERE_RADIUS / PETAL_COUNT) * Math.Sin ? Math.Sin(theta1) : Math.sin(theta1);
  const dEta = du / Math.max(halfW, 0.2);

  if (isFlat) {
    eta += dEta;
    const sectorLimit = theta1 / Math.sin(theta1);
    if (eta > sectorLimit) {
      petalIndex = (petalIndex + 1) % PETAL_COUNT;
      eta -= 2.0 * sectorLimit;
    } else if (eta < -sectorLimit) {
      petalIndex = (petalIndex - 1 + PETAL_COUNT) % PETAL_COUNT;
      eta += 2.0 * sectorLimit;
    }
    hopY = 0;
    badge.textContent = Math.abs(eta) > 1.0
      ? "状態①：平面（花弁の「隙間」の上を歩行中！）"
      : `状態①：平面（花弁 #${petalIndex + 1} の上を歩行中）`;
    badge.style.borderLeftColor = "#3fb950";
  } else if (isSphere) {
    eta += dEta;
    if (eta > 1.0) {
      petalIndex = (petalIndex + 1) % PETAL_COUNT;
      eta -= 2.0;
    } else if (eta < -1.0) {
      petalIndex = (petalIndex - 1 + PETAL_COUNT) % PETAL_COUNT;
      eta += 2.0;
    }
    hopY = 0;
    badge.textContent = `状態④：球体（花弁 #${petalIndex + 1} 切れ目を越えて360°周回可能）`;
    badge.style.borderLeftColor = "#58a6ff";
  } else {
    if (Math.abs(eta) > 1.0) {
      hopStartEta = eta;
      hopTargetEta = Math.sign(eta) * 0.85;
      hopTimer = 0;
      isHopping = true;
    } else {
      if (arcS < 1.2) {
        const phi = petalIndex * (Math.PI * 2 / PETAL_COUNT) + eta * (Math.PI / PETAL_COUNT);
        const x = arcS * Math.cos(phi) + du;
        const z = arcS * Math.sin(phi) + ds;
        arcS = Math.max(0.2, Math.min(MAX_S, Math.hypot(x, z)));
        const newPhi = Math.atan2(z, x);
        petalIndex = Math.round((newPhi < 0 ? newPhi + Math.PI * 2 : newPhi) / (Math.PI * 2 / PETAL_COUNT)) % PETAL_COUNT;
      }
      eta = Math.max(-0.92, Math.min(0.92, eta + dEta));
      badge.textContent = `状態③：遷移中（花弁 #${petalIndex + 1} の縁で落下防止ロック）`;
      badge.style.borderLeftColor = "#d29922";
    }
  }
}

// --- 入力＆UIイベント ---
const inputState = { up: false, down: false, left: false, right: false };
function bindTouch(id, key) {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); inputState[key] = true; });
  el.addEventListener('touchend',   e => { e.preventDefault(); inputState[key] = false; });
  el.addEventListener('mousedown',  () => inputState[key] = true);
  el.addEventListener('mouseup',    () => inputState[key] = false);
  el.addEventListener('mouseleave', () => inputState[key] = false);
}
bindTouch('btn-up', 'up');
bindTouch('btn-down', 'down');
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');

// テストボタン1：隙間に配置する
document.getElementById('btn-test-gap').addEventListener('click', () => {
  closeAmount = 0.0;
  document.getElementById('slider-close').value = 0.0;
  document.getElementById('val-close').textContent = "0% (平面ステージ)";
  petalIndex = 0;
  arcS = 14.0;
  eta = 1.35; // 花弁の外（隙間）に配置
  hopY = 0; isHopping = false;
});

// テストボタン2：北極点（先端）を直進突破
document.getElementById('btn-test-pole').addEventListener('click', () => {
  arcS = MAX_S - 1.5; // 先端の直前へワープ
  eta = 0.0;
  hopY = 0; isHopping = false;
});

const sliderClose = document.getElementById('slider-close');
const valClose = document.getElementById('val-close');
sliderClose.addEventListener('input', e => {
  closeAmount = parseFloat(e.target.value);
  const pct = Math.round(closeAmount * 100);
  valClose.textContent = pct === 0 ? "0% (平面ステージ)" : pct === 100 ? "100% (完全密閉球体)" : `${pct}% (遷移中)`;
});

// スマホタッチでのカメラ回転
let isDragging = false, prevMousePos = { x: 0, y: 0 };
window.addEventListener('touchstart', e => {
  if (e.target.closest('#ui-panel')) return;
  isDragging = true; prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
window.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dx = e.touches[0].clientX - prevMousePos.x;
  visualWorldRoot.rotation.y += dx * 0.008;
  prevMousePos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
});
window.addEventListener('touchend', () => isDragging = false);

// --- メインループ ---
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  const speed = 7.5;
  let ds = 0, du = 0;
  if (inputState.up)    ds += speed * dt;
  if (inputState.down)  ds -= speed * dt;
  if (inputState.right) du += speed * dt;
  if (inputState.left)  du -= speed * dt;

  stepMovement(ds, du);
  updatePetals(closeAmount);

  const surf = evaluatePetalSurface(petalIndex, arcS, eta, closeAmount, hopY);

  // VRChat自分基準視点（自分が原点に直立、世界が逆回転）
  playerGroup.position.set(0, 0, 0);
  playerGroup.quaternion.identity();

  const invQuat = surf.quat.clone().invert();
  const currentWorldY = visualWorldRoot.rotation.y;
  visualWorldRoot.quaternion.copy(invQuat);
  visualWorldRoot.rotation.y += currentWorldY;

  const rotatedOffset = surf.pos.clone().applyQuaternion(invQuat);
  visualWorldRoot.position.copy(rotatedOffset.negate());

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
