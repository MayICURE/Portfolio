<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インク×アウトライン 融合テスト</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: transparent; 
            overflow: hidden; 
        }

        /* =========================================
           1. 奥のレイヤー：流体インクマーブル（強力ブラー）
        ========================================= */
        #bg-ink {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -10;
            background-color: #f0f2f5; 
            overflow: hidden;
            filter: blur(70px); /* インクを溶け合わせる */
            transform: translate3d(0, 0, 0); 
            pointer-events: none;
        }

        .ink-blob {
            position: absolute;
            border-radius: 50%;
            mix-blend-mode: multiply; 
            opacity: 0.8;
            will-change: transform;
        }

        .ink-1 { width: 60vw; height: 60vw; background-color: #c9d6e8; top: -10vh; left: -10vw; animation: move1 18s infinite alternate ease-in-out; }
        .ink-2 { width: 70vw; height: 70vw; background-color: #dbe4f0; bottom: -20vh; right: -10vw; animation: move2 22s infinite alternate ease-in-out; }
        .ink-3 { width: 50vw; height: 50vw; background-color: #b5c7dd; top: 40vh; left: 30vw; animation: move3 25s infinite alternate-reverse ease-in-out; }
        .ink-4 { width: 80vw; height: 80vw; background-color: #e2e8f0; top: 10vh; right: 20vw; animation: move4 20s infinite alternate ease-in-out; }

        @keyframes move1 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(30vw, 20vh) scale(1.3); } }
        @keyframes move2 { 0% { transform: translate(0, 0) scale(1.2); } 100% { transform: translate(-40vw, -20vh) scale(0.8); } }
        @keyframes move3 { 0% { transform: translate(0, 0) scale(0.8); } 100% { transform: translate(-30vw, -30vh) scale(1.4); } }
        @keyframes move4 { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(20vw, 40vh) scale(1.1); } }


        /* =========================================
           2. 手前のレイヤー：アウトラインマーブル（線のみ）
        ========================================= */
        #bg-outline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -9; /* インクより1つ手前に配置 */
            overflow: hidden;
            pointer-events: none;
        }

        .outline-blob {
            position: absolute;
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; /* アメーバ状の有機的な形 */
            /* 背景は透明にし、少し青みがかった細い線を設定 */
            background-color: transparent;
            border: 1px solid rgba(161, 196, 253, 0.6); 
            will-change: transform;
        }

        .outline-1 { width: 100vmax; height: 100vmax; top: -20vh; left: -10vw; animation: flow1 35s infinite linear; }
        .outline-2 { width: 120vmax; height: 120vmax; bottom: -30vh; right: -20vw; animation: flow2 40s infinite linear reverse; }
        .outline-3 { width: 90vmax; height: 90vmax; top: 20vh; left: 30vw; animation: flow3 30s infinite linear; }

        /* ゆっくり回転しながら少し移動することで複雑に交差する */
        @keyframes flow1 {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            33% { transform: rotate(120deg) translate(5vw, 5vh) scale(1.05); }
            66% { transform: rotate(240deg) translate(-5vw, 10vh) scale(0.95); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }
        @keyframes flow2 {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            33% { transform: rotate(120deg) translate(-10vw, -5vh) scale(1.05); }
            66% { transform: rotate(240deg) translate(5vw, -10vh) scale(0.95); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }
        @keyframes flow3 {
            0% { transform: rotate(0deg) translate(0, 0) scale(1); }
            33% { transform: rotate(120deg) translate(10vw, -10vh) scale(0.95); }
            66% { transform: rotate(240deg) translate(-10vw, 5vh) scale(1.05); }
            100% { transform: rotate(360deg) translate(0, 0) scale(1); }
        }


        /* ▼▼▼ 波紋ローディング演出 ▼▼▼ */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        #loader-ripples {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; display: flex; justify-content: center; align-items: center;
        }
        .ripple {
            position: absolute; border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            transform: scale(0) rotate(0deg); opacity: 0; transform-origin: center center;
            will-change: transform, opacity;
        }
        .ripple-1 { width: 150vmax; height: 150vmax; background: linear-gradient(45deg, rgba(161, 196, 253, 0.9), rgba(194, 233, 251, 0.9)); }
        .ripple-2 { width: 160vmax; height: 160vmax; background: linear-gradient(45deg, rgba(224, 195, 252, 0.9), rgba(142, 197, 252, 0.9)); }
        .ripple-3 { width: 170vmax; height: 170vmax; background: linear-gradient(45deg, rgba(251, 194, 235, 0.9), rgba(166, 193, 238, 0.9)); }
        .ripple-white { width: 200vmax; height: 200vmax; background: #ffffff; border-radius: 50%; }

        .ripple.active:not(.ripple-white) { animation: rippleGrow 4.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        .ripple-1.active { animation-delay: 0s; }
        .ripple-2.active { animation-delay: 0.5s; }
        .ripple-3.active { animation-delay: 1.0s; }
        .ripple-white.active { animation: rippleWhiteGrow 3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; animation-delay: 2.2s; }

        @keyframes rippleGrow { 0% { transform: scale(0) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 100% { transform: scale(1.5) rotate(180deg); opacity: 1; } }
        @keyframes rippleWhiteGrow { 0% { transform: scale(0); opacity: 0; } 50% { opacity: 1; } 100% { transform: scale(1.5); opacity: 1; } }

        #loader-text {
            position: relative; z-index: 3; color: #fff;
            font-size: 2.5rem; font-weight: 300; letter-spacing: 0.2em; cursor: pointer;
            transition: opacity 1s ease, transform 0.3s ease, text-shadow 0.3s ease; user-select: none;
        }
        #loader-text:hover { transform: scale(1.05); text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); }
        #loader-text.fade-out { opacity: 0; transform: scale(0.9); }

        /* ▼▼▼ 確認用のダミーテキスト ▼▼▼ */
        .test-content {
            position: relative; z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center; height: 100vh; color: #333; text-align: center;
        }
        .test-content h1 { font-size: 3rem; letter-spacing: 0.2em; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 1. 奥のレイヤー：ぼかしインク -->
    <div id="bg-ink">
        <div class="ink-blob ink-1"></div>
        <div class="ink-blob ink-2"></div>
        <div class="ink-blob ink-3"></div>
        <div class="ink-blob ink-4"></div>
    </div>

    <!-- 2. 手前のレイヤー：くっきりアウトライン -->
    <div id="bg-outline">
        <div class="outline-blob outline-1"></div>
        <div class="outline-blob outline-2"></div>
        <div class="outline-blob outline-3"></div>
    </div>

    <!-- ローディング画面 -->
    <div id="loader">
        <div id="loader-ripples">
            <div class="ripple ripple-1"></div>
            <div class="ripple ripple-2"></div>
            <div class="ripple ripple-3"></div>
            <div class="ripple ripple-white"></div>
        </div>
        <div id="loader-text">∑ay][</div>
    </div>

    <!-- メインコンテンツ（テスト用） -->
    <div class="test-content">
        <h1>融合アートテスト</h1>
        <p>奥でインクが溶け合い、手前で細い線が交差します。<br>（デジタル×オーガニックの融合感）</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loaderText = document.getElementById('loader-text');
            const loader = document.getElementById('loader');
            const ripples = document.querySelectorAll('.ripple');
            let hasStarted = false;

            loaderText.addEventListener('click', function() {
                if (hasStarted) return;
                hasStarted = true;

                ripples.forEach(r => r.classList.add('active'));
                
                setTimeout(() => {
                    loaderText.classList.add('fade-out');
                }, 2800);

                setTimeout(() => {
                    loader.classList.add('hidden');
                }, 4500);
            });
        });
    </script>
</body>
</html>
