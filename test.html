<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>軽量・輪郭うねうねインク テスト</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000; overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }

        /* SVGを使わず、CSSの軽い「ぼかし」だけでエッジを少しだけ馴染ませる */
        #loader-ripples {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1;
            filter: blur(8px); /* 輪郭を少しだけ柔らかくする */
            transition: filter 2.5s ease;
        }

        /* ぐるぐる混ぜる時に一気に色を溶け合わせる */
        #loader-ripples.stir {
            filter: blur(30px);
        }

        /* インクの共通設定 */
        .ripple {
            position: absolute;
            transform: scale(0) rotate(0deg); opacity: 0;
            transform-origin: center center;
            mix-blend-mode: screen; /* 色が重なると光を放つように綺麗に混ざる */
            will-change: transform, opacity, border-radius; /* GPUで処理して超軽量化 */
        }

        /* 中身をしっかりと色で埋める（ベタ塗りに近い形） */
        /* ① 最初：真ん中に落ちるメインの青 */
        .ripple-1 { 
            width: 100vmax; height: 100vmax; top: 50%; left: 50%; margin-top: -50vmax; margin-left: -50vmax;
            background-color: rgba(0, 136, 255, 0.9); 
        }
        /* ② 次：右下から来る紫 */
        .ripple-2 { 
            width: 120vmax; height: 120vmax; top: 75%; left: 75%; margin-top: -60vmax; margin-left: -60vmax;
            background-color: rgba(140, 0, 255, 0.85); 
        }
        /* ③ 最後：左上から来る水色 */
        .ripple-3 { 
            width: 130vmax; height: 130vmax; top: 25%; left: 25%; margin-top: -65vmax; margin-left: -65vmax;
            background-color: rgba(0, 255, 200, 0.85); 
        }
        
        /* すべてを飲み込む純白 */
        .ripple-white { 
            width: 300vmax; height: 300vmax; top: 50%; left: 50%; margin-top: -150vmax; margin-left: -150vmax;
            background: #ffffff; mix-blend-mode: normal; border-radius: 50%;
        }

        /* アニメーションの発火設定（動きが止まらないよう linear に近いイージング） */
        .ripple.active:not(.ripple-white) { animation: inkSpread 5.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        
        /* 完璧な時間差（ぽつ、ぽつ、ぽつ） */
        .ripple-1.active { animation-delay: 0s; }
        .ripple-2.active { animation-delay: 0.6s; }
        .ripple-3.active { animation-delay: 1.2s; }
        .ripple-white.active { animation: rippleWhiteGrow 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 3.5s; }

        /* ▼ 輪郭がうねうねと動き続けるアニメーション ▼ */
        @keyframes inkSpread { 
            0% { 
                transform: scale(0) rotate(0deg); opacity: 0; 
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            } 
            5% { opacity: 0.95; }
            /* 常に回転・拡大を続けながら、輪郭の形（border-radius）をランダムに変化させる */
            30% { 
                transform: scale(0.6) rotate(120deg); opacity: 0.95; 
                border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; 
            }
            60% { 
                transform: scale(1.3) rotate(360deg); opacity: 0.95; 
                border-radius: 30% 70% 40% 60% / 60% 40% 70% 30%; 
            }
            /* 最後は筆でかき混ぜるように一気に爆発的回転 */
            100% { 
                transform: scale(4) rotate(720deg); opacity: 1; 
                border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; /* 最終的に丸く落ち着く */
            } 
        }

        @keyframes rippleWhiteGrow { 
            0% { transform: scale(0); opacity: 0; } 
            50% { opacity: 1; } 
            100% { transform: scale(1.5); opacity: 1; } 
        }

        /* --- 中央のテキスト演出 --- */
        #loader-text-wrapper {
            position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; user-select: none; transition: opacity 1.5s ease, transform 0.5s ease, filter 2s ease;
        }
        #loader-text-wrapper:hover { transform: scale(1.05); }
        
        /* 混ざるインクに溶け込むように消える */
        #loader-text-wrapper.fade-out { 
            opacity: 0; transform: scale(0.8) translateY(-20px); filter: blur(15px); 
        }

        #loader-text {
            color: #fff; font-size: 2.5rem; font-weight: 300; letter-spacing: 0.2em;
            animation: textPulse 3s infinite alternate ease-in-out;
        }
        
        #loader-subtext {
            color: rgba(255, 255, 255, 0.8); font-size: 0.8rem; letter-spacing: 0.3em; 
            font-weight: bold; margin-top: 15px;
            animation: textPulse 3s infinite alternate ease-in-out 0.5s; 
        }

        @keyframes textPulse {
            0% { opacity: 0.6; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
            100% { opacity: 1; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 40px rgba(0, 136, 255, 0.6); }
        }
    </style>
</head>
<body>

    <!-- ローディング画面 -->
    <div id="loader">
        <div id="loader-ripples">
            <!-- タイミングをずらして垂らされる絵の具 -->
            <div class="ripple ripple-1"></div>
            <div class="ripple ripple-2"></div>
            <div class="ripple ripple-3"></div>
            <div class="ripple ripple-white"></div>
        </div>
        
        <div id="loader-text-wrapper">
            <div id="loader-text">∑ay][</div>
            <div id="loader-subtext">TAP TO START</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loaderWrapper = document.getElementById('loader-text-wrapper');
            const ripplesContainer = document.getElementById('loader-ripples');
            const ripples = document.querySelectorAll('.ripple');
            let hasStarted = false;

            loaderWrapper.addEventListener('click', function() {
                if (hasStarted) return;
                hasStarted = true;

                // 1. 真ん中 → 右下 → 左上の順で自動的に発火
                ripples.forEach(r => r.classList.add('active'));
                
                // 2. 約2.5秒後：ブラーを強くして色を完全に混ざり合わせる
                setTimeout(() => { 
                    ripplesContainer.classList.add('stir'); 
                }, 2500);
                
                // 3. 同時にテキストが溶け消える
                setTimeout(() => { 
                    loaderWrapper.classList.add('fade-out'); 
                }, 2500);
            });
        });
    </script>
</body>
</html>
