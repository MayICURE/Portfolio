<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極・流体インク ローディングテスト</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000; overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        /* --- ローディング画面コンテナ --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }

        /* ▼▼▼ 流体エフェクトのキモ ▼▼▼ */
        #loader-ripples {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1;
            /* ここでSVGの流体ノイズフィルターと、初期の「滲み」のぼかしをかけます */
            filter: url(#fluid-ink) blur(8px);
            transition: filter 2.5s ease-in; /* かき混ぜる時の遷移設定 */
        }
        
        /* 「筆でぐるぐる混ぜる」フェーズに移行した時のクラス */
        #loader-ripples.stir {
            /* 混ぜられて色が一体化していくようにブラーを強くする */
            filter: url(#fluid-ink) blur(35px);
        }

        /* インクの粒たちの共通設定 */
        .ripple {
            position: absolute;
            /* 最初から少し歪な形にしておく */
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            transform: scale(0) rotate(0deg); opacity: 0;
            transform-origin: center center;
            mix-blend-mode: screen; /* 色が重なると明るく発光・混ざる */
            will-change: transform, opacity;
        }

        /* インクの色と配置（深いグラデーションで中心を濃く、外側を薄く） */
        .ripple-1 { 
            width: 120vmax; height: 120vmax; top: 50%; left: 50%; margin-top: -60vmax; margin-left: -60vmax;
            background: radial-gradient(circle at 40% 40%, rgba(0, 136, 255, 1) 0%, rgba(0, 136, 255, 0.4) 50%, transparent 80%); 
        }
        .ripple-2 { 
            width: 140vmax; height: 140vmax; top: 70%; left: 70%; margin-top: -70vmax; margin-left: -70vmax;
            background: radial-gradient(circle at 60% 60%, rgba(140, 0, 255, 1) 0%, rgba(140, 0, 255, 0.4) 50%, transparent 80%); 
        }
        .ripple-3 { 
            width: 150vmax; height: 150vmax; top: 30%; left: 30%; margin-top: -75vmax; margin-left: -75vmax;
            background: radial-gradient(circle at 30% 70%, rgba(0, 255, 200, 1) 0%, rgba(0, 255, 200, 0.4) 50%, transparent 80%); 
        }
        
        /* 最後にすべてを純白にする光のインク */
        .ripple-white { 
            width: 300vmax; height: 300vmax; top: 50%; left: 50%; margin-top: -150vmax; margin-left: -150vmax;
            background: #ffffff; mix-blend-mode: normal; border-radius: 50%;
        }

        /* アニメーションの発火設定 */
        .ripple.active:not(.ripple-white) { animation: inkSpread 5.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        .ripple-1.active { animation-delay: 0s; }
        .ripple-2.active { animation-delay: 0.5s; } /* ぽつ、ぽつ、と時間差で垂らす */
        .ripple-3.active { animation-delay: 1.0s; }
        .ripple-white.active { animation: rippleWhiteGrow 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 3.8s; }

        /* ▼ インクの動きのシナリオ ▼ */
        @keyframes inkSpread { 
            0% { transform: scale(0) rotate(0deg); opacity: 0; } 
            10% { opacity: 0.9; }
            /* 0秒〜2.5秒：水に落ちて「じんわり」と広がるフェーズ */
            50% { transform: scale(0.5) rotate(45deg); opacity: 0.9; } 
            /* 2.5秒〜5.5秒：筆で「ぐるぐる」とかき混ぜられ、激しく回転・拡散するフェーズ */
            100% { transform: scale(3.5) rotate(800deg); opacity: 1; } 
        }

        @keyframes rippleWhiteGrow { 
            0% { transform: scale(0); opacity: 0; } 
            40% { opacity: 1; } 
            100% { transform: scale(1.5); opacity: 1; } 
        }

        /* --- 中央のテキスト演出 --- */
        #loader-text-wrapper {
            position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; user-select: none; transition: opacity 1.5s ease, transform 0.5s ease, filter 2s ease;
        }
        #loader-text-wrapper:hover { transform: scale(1.05); }
        
        /* 混ざるインクに溶け込むように消える */
        #loader-text-wrapper.fade-out { 
            opacity: 0; transform: scale(0.8) translateY(-20px); filter: blur(15px); 
        }

        /* メインテキスト */
        #loader-text {
            color: #fff; font-size: 2.5rem; font-weight: 300; letter-spacing: 0.2em;
            animation: textPulse 3s infinite alternate ease-in-out;
        }
        
        /* 「TAP TO START」のサブテキスト */
        #loader-subtext {
            color: rgba(255, 255, 255, 0.8); font-size: 0.8rem; letter-spacing: 0.3em; 
            font-weight: bold; margin-top: 15px;
            animation: textPulse 3s infinite alternate ease-in-out 0.5s; /* 少しタイミングをずらして呼吸感を出す */
        }

        /* ホタルのようにふんわりと青白く発光・点滅する */
        @keyframes textPulse {
            0% { opacity: 0.6; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
            100% { opacity: 1; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 40px rgba(0, 136, 255, 0.6); }
        }
    </style>
</head>
<body>

    <!-- ▼▼▼ 水・流体をシミュレートする不可視のSVGフィルター ▼▼▼ -->
    <svg style="display: none;">
        <defs>
            <!-- 画面全体を覆うように余裕を持たせる -->
            <filter id="fluid-ink" x="-50%" y="-50%" width="200%" height="200%">
                <!-- baseFrequencyが水流の細かさ。スケールするほど輪郭が千切れる -->
                <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" />
                <!-- scale="150" でピクセルを強烈に引き伸ばし、インクの滲みを作る -->
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="150" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- ローディング画面 -->
    <div id="loader">
        <div id="loader-ripples">
            <!-- 垂らされる絵の具（インク）たち -->
            <div class="ripple ripple-1"></div>
            <div class="ripple ripple-2"></div>
            <div class="ripple ripple-3"></div>
            <div class="ripple ripple-white"></div>
        </div>
        
        <!-- クリック領域とテキスト -->
        <div id="loader-text-wrapper">
            <div id="loader-text">∑ay][</div>
            <div id="loader-subtext">TAP TO START</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loaderWrapper = document.getElementById('loader-text-wrapper');
            const ripplesContainer = document.getElementById('loader-ripples');
            const ripples = document.querySelectorAll('.ripple');
            let hasStarted = false;

            loaderWrapper.addEventListener('click', function() {
                if (hasStarted) return;
                hasStarted = true;

                // 1. インクを落とす（じんわり広がるフェーズ開始）
                ripples.forEach(r => r.classList.add('active'));
                
                // 2. 約2.5秒後、筆で「ぐるぐる」かき混ぜるようにブラーを強くする
                setTimeout(() => { 
                    ripplesContainer.classList.add('stir'); 
                }, 2500);
                
                // 3. 同時進行でテキストがインクに溶け込むようにフェードアウト
                setTimeout(() => { 
                    loaderWrapper.classList.add('fade-out'); 
                }, 2800);

                // （本来ならここで6〜7秒後にサイト本編へフェードイン）
            });
        });
    </script>
</body>
</html>
