<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>8K Native Watercolor Logo Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
<style>
  body { font-family: sans-serif; padding: 24px; background: #f4f6f8; color: #333; }
  .box { max-width: 720px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  button { margin: 8px 8px 8px 0; padding: 10px 18px; font-size: 15px; cursor: pointer; }
  canvas { max-width: 100%; height: auto; margin-top: 16px; background: repeating-conic-gradient(#ececec 0% 25%, #ffffff 0% 50%) 50% / 20px 20px; border: 1px solid #ccc; }
</style>
</head>
<body>
<div class="box">
  <h2>パターン2：8K（7680×4320）ネイティブ水彩＆筆記体ジェネレーター</h2>
  <button id="rerollBtn">水彩の形を少し変える</button>
  <button id="dlTransparentBtn">8K 透過PNGを保存</button>
  <button id="dlWhiteBtn">8K 白背景PNGを保存</button>
  <canvas id="canvas" width="7680" height="4320"></canvas>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function drawPetalCluster(cx, cy, baseRadius, colorRgb, petalCount) {
  for (let i = 0; i < petalCount; i++) {
    const angle = (Math.PI * 2 * i) / petalCount + (Math.random() - 0.5) * 0.5;
    const dist = baseRadius * (0.3 + Math.random() * 0.55);
    const px = cx + Math.cos(angle) * dist;
    const py = cy + Math.sin(angle) * dist;
    const r = baseRadius * (0.35 + Math.random() * 0.45);

    const grad = ctx.createRadialGradient(px, py, r * 0.1, px, py, r);
    grad.addColorStop(0, `rgba(${colorRgb}, 0.28)`);
    grad.addColorStop(0.65, `rgba(${colorRgb}, 0.18)`);
    grad.addColorStop(0.9, `rgba(${colorRgb}, 0.06)`);
    grad.addColorStop(1, `rgba(${colorRgb}, 0)`);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function renderLogo(withWhiteBg = false) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (withWhiteBg) {
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // ペールグリーンとペールブルーのぼんやりした花塊（アジサイ・花束風シルエット）
  const clusters = [
    { x: 2550, y: 1850, r: 520, c: '180, 232, 155', n: 14 },
    { x: 3200, y: 2350, r: 620, c: '165, 228, 195', n: 16 },
    { x: 3850, y: 1950, r: 580, c: '160, 220, 242', n: 15 },
    { x: 4650, y: 1820, r: 560, c: '155, 215, 240', n: 16 },
    { x: 4300, y: 2450, r: 500, c: '185, 235, 160', n: 12 },
    { x: 5150, y: 2280, r: 480, c: '175, 230, 165', n: 14 }
  ];

  clusters.forEach(cl => drawPetalCluster(cl.x, cl.y, cl.r, cl.c, cl.n));

  // 控えめな水彩しぶき（ドット）
  for (let i = 0; i < 45; i++) {
    const sx = 2000 + Math.random() * 3700;
    const sy = 1250 + Math.random() * 1800;
    const sr = 8 + Math.random() * 28;
    const isGreen = Math.random() > 0.5;
    ctx.fillStyle = isGreen ? 'rgba(170, 225, 150, 0.35)' : 'rgba(155, 215, 238, 0.35)';
    ctx.beginPath();
    ctx.arc(sx, sy, sr, 0, Math.PI * 2);
    ctx.fill();
  }

  // 1行の細筆記体テキスト（8K解像度）
  ctx.fillStyle = '#FFFFFF';
  ctx.font = '920px "Allura", cursive';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('BlumenKrone', canvas.width / 2, canvas.height / 2 + 40);
}

document.fonts.ready.then(() => renderLogo(false));

document.getElementById('rerollBtn').addEventListener('click', () => renderLogo(false));

document.getElementById('dlTransparentBtn').addEventListener('click', () => {
  renderLogo(false);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Bindungen_flechten_8K_native_transparent.png';
    a.click();
  }, 'image/png');
});

document.getElementById('dlWhiteBtn').addEventListener('click', () => {
  renderLogo(true);
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Bindungen_flechten_8K_native_white.png';
    a.click();
    renderLogo(false);
  }, 'image/png');
});
</script>
</body>
</html>
