<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極・流体インク（連続波打ち＆時間差）テスト</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #000; overflow: hidden;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }

        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }

        /* ▼▼▼ 流体エフェクトのキモ ▼▼▼ */
        #loader-ripples {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1;
            /* 常に強力な歪みと滲みをかけ続ける */
            filter: url(#fluid-ink) blur(12px);
        }

        /* インクの粒たちの共通設定 */
        .ripple {
            position: absolute;
            transform: scale(0) rotate(0deg); opacity: 0;
            transform-origin: center center;
            mix-blend-mode: screen; /* 重なると色が明るく混ざる */
            will-change: transform, opacity, border-radius;
        }

        /* ① 最初：真ん中に落ちるメインの青 */
        .ripple-1 { 
            width: 120vmax; height: 120vmax; top: 50%; left: 50%; margin-top: -60vmax; margin-left: -60vmax;
            background: radial-gradient(circle at 50% 50%, rgba(0, 136, 255, 1) 0%, rgba(0, 136, 255, 0.4) 40%, transparent 70%); 
        }
        /* ② 次：右下から来る紫 */
        .ripple-2 { 
            width: 140vmax; height: 140vmax; top: 75%; left: 75%; margin-top: -70vmax; margin-left: -70vmax;
            background: radial-gradient(circle at 50% 50%, rgba(140, 0, 255, 1) 0%, rgba(140, 0, 255, 0.4) 40%, transparent 70%); 
        }
        /* ③ 最後：左上から来る水色 */
        .ripple-3 { 
            width: 150vmax; height: 150vmax; top: 25%; left: 25%; margin-top: -75vmax; margin-left: -75vmax;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 200, 1) 0%, rgba(0, 255, 200, 0.4) 40%, transparent 70%); 
        }
        
        /* すべてを飲み込む純白 */
        .ripple-white { 
            width: 300vmax; height: 300vmax; top: 50%; left: 50%; margin-top: -150vmax; margin-left: -150vmax;
            background: #ffffff; mix-blend-mode: normal; border-radius: 50%;
        }

        /* ▼ アニメーションの設定（イージングを linear に近づけて停滞感をなくす） ▼ */
        .ripple.active:not(.ripple-white) { animation: inkSpread 5.5s ease-in forwards; }
        
        /* ここでタイミングを完全にずらしています */
        .ripple-1.active { animation-delay: 0s; }
        .ripple-2.active { animation-delay: 0.6s; }
        .ripple-3.active { animation-delay: 1.2s; }
        .ripple-white.active { animation: rippleWhiteGrow 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; animation-delay: 3.5s; }

        /* ▼ 絶え間なく動き、形を変え、加速していくアニメーション ▼ */
        @keyframes inkSpread { 
            0% { 
                transform: scale(0) rotate(0deg); opacity: 0; 
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; 
            } 
            5% { opacity: 0.9; }
            /* 待機せず、常に回転と拡大を続けながら形（border-radius）を歪ませる */
            40% { 
                transform: scale(0.8) rotate(120deg); opacity: 0.9; 
                border-radius: 60% 40% 30% 70% / 50% 60% 40% 60%; 
            }
            70% { 
                transform: scale(1.6) rotate(360deg); opacity: 0.9; 
                border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; 
            }
            /* 最後は筆でかき混ぜるように一気に爆発的回転 */
            100% { 
                transform: scale(3.5) rotate(800deg); opacity: 1; 
                border-radius: 50%; 
            } 
        }

        @keyframes rippleWhiteGrow { 
            0% { transform: scale(0); opacity: 0; } 
            50% { opacity: 1; } 
            100% { transform: scale(1.5); opacity: 1; } 
        }

        /* --- 中央のテキスト演出 --- */
        #loader-text-wrapper {
            position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center;
            cursor: pointer; user-select: none; transition: opacity 1.5s ease, transform 0.5s ease, filter 2s ease;
        }
        #loader-text-wrapper:hover { transform: scale(1.05); }
        
        /* 混ざるインクに溶け込むように消える */
        #loader-text-wrapper.fade-out { 
            opacity: 0; transform: scale(0.8) translateY(-20px); filter: blur(15px); 
        }

        #loader-text {
            color: #fff; font-size: 2.5rem; font-weight: 300; letter-spacing: 0.2em;
            animation: textPulse 3s infinite alternate ease-in-out;
        }
        
        #loader-subtext {
            color: rgba(255, 255, 255, 0.8); font-size: 0.8rem; letter-spacing: 0.3em; 
            font-weight: bold; margin-top: 15px;
            animation: textPulse 3s infinite alternate ease-in-out 0.5s; 
        }

        @keyframes textPulse {
            0% { opacity: 0.6; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
            100% { opacity: 1; text-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 40px rgba(0, 136, 255, 0.6); }
        }
    </style>
</head>
<body>

    <!-- ▼▼▼ 進化した水・流体シミュレーター ▼▼▼ -->
    <svg style="width:0; height:0; position:absolute;">
        <defs>
            <filter id="fluid-ink" x="-50%" y="-50%" width="200%" height="200%">
                <!-- baseFrequencyをアニメーションさせることで、水自体が常にうねり続ける -->
                <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise">
                    <animate attributeName="baseFrequency" values="0.015;0.02;0.015" dur="4s" repeatCount="indefinite" />
                </feTurbulence>
                <!-- scale="250" で、インクの輪郭を限界まで引きちぎり波打たせる -->
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="250" xChannelSelector="R" yChannelSelector="G" />
            </filter>
        </defs>
    </svg>

    <!-- ローディング画面 -->
    <div id="loader">
        <div id="loader-ripples">
            <!-- タイミングをずらして垂らされる絵の具 -->
            <div class="ripple ripple-1"></div>
            <div class="ripple ripple-2"></div>
            <div class="ripple ripple-3"></div>
            <div class="ripple ripple-white"></div>
        </div>
        
        <div id="loader-text-wrapper">
            <div id="loader-text">∑ay][</div>
            <div id="loader-subtext">TAP TO START</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const loaderWrapper = document.getElementById('loader-text-wrapper');
            const ripples = document.querySelectorAll('.ripple');
            let hasStarted = false;

            loaderWrapper.addEventListener('click', function() {
                if (hasStarted) return;
                hasStarted = true;

                // 1. インクを落とす（CSSで設定した0s, 0.6s, 1.2sの順番で自動発火）
                ripples.forEach(r => r.classList.add('active'));
                
                // 2. 約2.5秒後：テキストがインクに巻き込まれて溶け消える
                setTimeout(() => { 
                    loaderWrapper.classList.add('fade-out'); 
                }, 2500);

                // （本来ならここで6秒後にサイト本編へフェードイン）
            });
        });
    </script>
</body>
</html>
